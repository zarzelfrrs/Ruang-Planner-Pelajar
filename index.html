<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5fb">
  <meta name="description" content="Planner sekolah personal yang rapi, ringan, dan bisa digunakan offline.">
  <title>Ruang — Planner Pelajar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar glass">
      <a class="brand" href="#" aria-label="Ruang beranda">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span><strong>ruang</strong><small>STUDENT PLANNER</small></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Navigasi utama">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Ringkasan</button>
        <button class="nav-item" data-view="schedule"><span class="nav-icon">▦</span>Jadwal pelajaran</button>
        <button class="nav-item" data-view="tasks"><span class="nav-icon">☷</span>Tugas & PR <span class="nav-count" id="taskCount">0</span></button>
        <button class="nav-item" data-view="calendar"><span class="nav-icon">▣</span>Kalender</button>
        <button class="nav-item" data-view="routines"><span class="nav-icon">◷</span>Rutinitas sekolah</button>
        <button class="nav-item" data-view="notes"><span class="nav-icon">▤</span>Catatan</button>
      </nav>
      <div class="side-bottom">
        <div class="side-tip"><span class="tip-dot"></span><div><b>Ruang milikmu</b><p>Semua data tersimpan di perangkat ini.</p></div></div>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Pengaturan</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark"><span></span><span></span><span></span></span><strong>ruang</strong></div>
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><b id="crumbTitle">Ringkasan</b></div>
        <div class="top-actions">
          <button class="icon-button" id="themeBtn" title="Ganti tema" aria-label="Ganti tema">☼</button>
          <button class="profile-chip" id="profileButton"><span class="avatar">✦</span><span id="profileName">Pelajar</span><span class="chevron">⌄</span></button>
        </div>
      </header>
      <section class="content" id="viewRoot" aria-live="polite"></section>
      <footer class="footer"><span>RUANG · PLANNER PELAJAR</span><span>Dirancang untuk hari yang lebih teratur.</span></footer>
    </main>
  </div>

  <nav class="bottom-nav glass" aria-label="Navigasi mobile">
    <button class="bottom-item active" data-view="home"><span>⌂</span><small>Beranda</small></button>
    <button class="bottom-item" data-view="schedule"><span>▦</span><small>Jadwal</small></button>
    <button class="bottom-item" data-view="tasks"><span>☷</span><small>Tugas</small></button>
    <button class="bottom-item" data-view="calendar"><span>▣</span><small>Kalender</small></button>
    <button class="bottom-item" data-view="routines"><span>◷</span><small>Lainnya</small></button>
  </nav>

  <dialog id="itemDialog" class="dialog glass">
    <form id="itemForm" method="dialog">
      <div class="dialog-head"><div><p class="eyebrow" id="dialogEyebrow">RUANG BARU</p><h2 id="dialogTitle">Tambah item</h2></div><button type="button" class="icon-button close-dialog" aria-label="Tutup">×</button></div>
      <div id="formFields" class="form-fields"></div>
      <div class="dialog-actions"><button type="button" class="button quiet close-dialog">Batal</button><button type="submit" class="button primary">Simpan <span>↗</span></button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
